<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Busca CNPJ por Endereço</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, Arial, sans-serif; margin: 0; background: #f4f6f8; color: #222; }
    header { background: #1f3a5f; color: #fff; padding: 16px 20px; }
    header h1 { margin: 0; font-size: 20px; }
    main { max-width: 900px; margin: 20px auto; padding: 0 16px; }
    .card { background: #fff; border-radius: 8px; padding: 20px; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
    label { display: block; font-weight: 600; margin: 10px 0 4px; }
    input { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
    .row { display: flex; gap: 12px; flex-wrap: wrap; }
    .row > div { flex: 1; min-width: 160px; }
    button { margin-top: 16px; background: #1f3a5f; color: #fff; border: 0; padding: 10px 18px; border-radius: 4px; font-size: 15px; cursor: pointer; }
    button:hover { background: #2a4d7a; }
    .opc { margin-top: 10px; }
    .opc summary { cursor: pointer; color: #1f3a5f; font-weight: 600; }
    table { width: 100%; border-collapse: collapse; margin-top: 16px; font-size: 13px; }
    th, td { text-align: left; padding: 8px; border-bottom: 1px solid #eee; }
    th { background: #f0f3f7; }
    .meta { color: #666; font-size: 13px; margin-top: 8px; }
    .err { color: #b00; margin-top: 12px; }
    .pager { margin-top: 14px; display: flex; gap: 10px; align-items: center; }
  </style>
</head>
<body>
  <header><h1>Busca CNPJ por Endereço (Receita Federal)</h1></header>
  <main>
    <div class="card">
      <form id="frm">
        <div class="row">
          <div>
            <label>UF *</label>
            <input id="uf" maxlength="2" required placeholder="ex.: ES" />
          </div>
          <div>
            <label>Município (código IBGE ou nome) *</label>
            <input id="municipio" required placeholder="ex.: 3203302 ou Vitória" />
          </div>
        </div>
        <details class="opc">
          <summary>Filtros opcionais</summary>
          <div class="row">
            <div><label>Logradouro</label><input id="logradouro" placeholder="ex.: Rua ..." /></div>
            <div><label>Número</label><input id="numero" placeholder="ex.: 100" /></div>
          </div>
          <div class="row">
            <div><label>Bairro</label><input id="bairro" /></div>
            <div><label>CEP</label><input id="cep" placeholder="só números" /></div>
          </div>
        </details>
        <button type="submit">Buscar CNPJs</button>
      </form>
      <div id="msg" class="meta"></div>
      <div id="err" class="err"></div>
      <div id="result"></div>
    </div>
  </main>

  <script>
    const API = "/api/busca";  // proxy nginx -> backend
    let page = 0;
    const SIZE = 20;

    function situacao(c) {
      return ({ "01":"NULA", "02":"ATIVA", "03":"SUSPENSA", "04":"INAPTA",
                "08":"BAIXADA" }[c] || c);
    }

    async function buscar(novaPagina) {
      if (novaPagina !== undefined) page = novaPagina;
      document.getElementById("err").textContent = "";
      const body = {
        uf: document.getElementById("uf").value.trim().toUpperCase(),
        municipio: document.getElementById("municipio").value.trim(),
        logradouro: document.getElementById("logradouro").value.trim(),
        numero: document.getElementById("numero").value.trim(),
        bairro: document.getElementById("bairro").value.trim(),
        cep: document.getElementById("cep").value.trim()
      };
      if (!body.uf || !body.municipio) {
        document.getElementById("err").textContent = "UF e Município são obrigatórios.";
        return;
      }
      document.getElementById("msg").textContent = "Buscando...";
      try {
        const r = await fetch(API + `?page=${page}&size=${SIZE}`, {
          method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body)
        });
        const data = await r.json();
        if (!r.ok) throw new Error(data.message || "Erro na busca");
        render(data);
      } catch (e) {
        document.getElementById("msg").textContent = "";
        document.getElementById("err").textContent = "Erro: " + e.message;
      }
    }

    function render(data) {
      const list = data.content || [];
      document.getElementById("msg").textContent =
        `Total de registros: ${data.totalElements ?? list.length} — página ${page + 1}`;
      if (!list.length) {
        document.getElementById("result").innerHTML = "<p>Nenhum CNPJ encontrado para este endereço.</p>";
        return;
      }
      let html = "<table><thead><tr><th>CNPJ</th><th>Nome</th><th>Endereço</th><th>Situação</th></tr></thead><tbody>";
      for (const e of list) {
        const end = `${e.tipoLogradouro||""} ${e.logradouro||""}, ${e.numero||""}` +
                    `${e.bairro? " — "+e.bairro : ""}` +
                    `${e.nomeMunicipio? " — "+e.nomeMunicipio+"/"+e.uf : " — "+e.uf}` +
                    `${e.cep? " — CEP "+e.cep : ""}`;
        html += `<tr><td>${e.cnpj||""}</td><td>${e.nomeFantasia||e.razaoSocial||"—"}</td>` +
                `<td>${end}</td><td>${situacao(e.situacaoCadastral)}</td></tr>`;
      }
      html += "</tbody></table>";
      html += `<div class="pager"><button ${page===0?'disabled':''} onclick="buscar(${page-1})">Anterior</button>` +
              `<span>página ${page+1}</span>` +
              `<button onclick="buscar(${page+1})">Próxima</button></div>`;
      document.getElementById("result").innerHTML = html;
    }

    document.getElementById("frm").addEventListener("submit", (e) => { e.preventDefault(); buscar(0); });
  </script>
</body>
</html>
